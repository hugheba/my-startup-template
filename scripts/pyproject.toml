[project]
name = "scripts"
version = "0.0.0"
description = "Ad-hoc Python scripts and custom MCP servers for this monorepo."
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pytest==9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
