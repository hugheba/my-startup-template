# Git hooks. Replaces husky + lint-staged: lefthook both installs the hooks
# (`pnpm prepare` → `lefthook install`) and runs the checks, so what used to be
# two shell scripts under `.husky/` plus a `lint-staged` block in package.json
# now lives here.
#
# Jobs run SEQUENTIALLY — do not add `parallel: true`. `eslint --fix` and
# `prettier --write` rewrite the same staged files, so running them
# concurrently races on the same bytes and whichever finishes last wins.
# lint-staged serialized them within a glob group for exactly this reason.
#
# `{staged_files}` expands to `git diff --name-only --cached --diff-filter=ACMR`,
# so deleted files are already excluded and no job is handed a path that no
# longer exists.

pre-commit:
  jobs:
    - name: eslint
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    - name: prettier
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    # The same scanner CI runs, pinned to the same version in .devcontainer/.env.
    # It used to be secretlint here and gitleaks in CI, which made the innermost
    # gate the weakest one — secretlint's preset does not flag `AKIA…` AWS keys.
    #
    # No `{staged_files}` and no glob: `--staged` reads the index directly, so
    # every staged file is covered including the types no formatter above touches
    # (.env, .pem, .txt, a fixture). Reads only, so no stage_fixed.
    #
    # `-v` is load-bearing, not noise: without it a finding prints exactly
    # "leaks found: 1" and nothing else — no file, no line, no rule. With it you
    # get the Fingerprint, which is the string `.gitleaksignore` takes.
    #
    # Unlike CI this does NOT pass --redact. A finding here is in your own
    # working tree on your own terminal, and seeing which string tripped is the
    # whole point; CI redacts because its logs are public on a public repo.
    - name: gitleaks
      run: gitleaks git --staged --no-banner -v

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
