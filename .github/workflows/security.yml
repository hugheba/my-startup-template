name: Security Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

# Read-only by default; each job grants itself the one extra scope it needs.
# This used to be the union of all four jobs' needs, applied to all four —
# which handed `security-events: write` and `pull-requests: write` to the
# gitleaks and audit jobs that never touch either. Every job in this file runs
# third-party code (the ZAP action, the CodeQL action, the gitleaks image)
# against a checkout while holding this token, so the union is the one shape to
# avoid here.
permissions:
  contents: read

# Every checkout below also sets `persist-credentials: false`. Checkout
# otherwise writes this job's GITHUB_TOKEN into .git/config as an
# http.extraheader, and these jobs run third-party actions and PR-authored code
# against that workspace while holding the extra scopes granted below.
# `zap-baseline` is the sharp case: it chmods the entire workspace to 777 and
# then runs both the ZAP action and the PR's own built app. No job here talks to
# the remote after checkout — `gitleaks git` does walk commit history, but it
# reads the local clone that `fetch-depth: 0` already fetched — so none of them
# needs the credential.

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    # For the PR comment at the end of this job. `allow_issue_writing: false`
    # keeps the ZAP action itself from filing issues, so no `issues` scope.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', '**/package.json', 'turbo.json', 'tsconfig*.json', '.env.example') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build app
        run: pnpm -F web build

      # Polled with curl rather than `npx --yes wait-on`: that fetched an
      # unpinned package from the network on every run, inside the workflow
      # whose entire job is to be trustworthy, to do what four lines of shell
      # already do. It also violated the exact-pinning rule in AGENTS.md —
      # `pnpm verify:deps` never caught it because the gate scans package.json
      # scripts, not workflow files.
      - name: Start app
        run: |
          pnpm -F web start > /tmp/zap-boot.log 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            curl -fsS http://localhost:3000 >/dev/null && exit 0
            # Same early-exit as the boot check in ci.yml: a crashed server is
            # the likeliest reason this step fails, and polling it for the full
            # minute reports a timeout instead of the stack trace.
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::app exited during startup — ZAP would scan nothing"
              cat /tmp/zap-boot.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::app never answered on :3000 within 60s — ZAP would scan nothing"
          cat /tmp/zap-boot.log
          exit 1
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Fix workspace permissions for ZAP
        run: chmod -R 777 ${{ github.workspace }} || true

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false
          artifact_name: 'zap-scan'

      - name: Upload ZAP scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report_json.json
          retention-days: 30

      - name: Comment ZAP results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = 'No critical issues found';
            if (fs.existsSync('report_json.json')) {
              const zapReport = JSON.parse(fs.readFileSync('report_json.json'));
              const alerts = zapReport.site?.[0]?.alerts || [];
              const critical = alerts.filter(a => a.riskcode === '3');
              if (critical.length > 0) {
                report = `⚠️ **${critical.length} Critical Security Issues Found**\n\n`;
                critical.forEach(a => { report += `- **${a.name}**: ${a.desc}\n`; });
              } else {
                report = '✅ No critical security issues found';
              }
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Scan Results\n\n${report}`,
            });

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The Snyk step that used to run here was removed. It referenced
      # `snyk/actions/node@master` — a moving branch, not a tag, so every run
      # executed whatever that branch happened to contain at that moment. It
      # also required SNYK_TOKEN, which this repo does not set, so it was
      # `continue-on-error: true` and produced nothing on every run. It was
      # third-party code with repo access, zero output, and no version pin.
      # Dependabot alerts and the audit below already cover this ground.

      # Advisory, not blocking — deliberately. GitHub's Dependabot alerts
      # (Security tab) are the authoritative watcher here and read the same
      # advisory database; they flagged brace-expansion GHSA-mh99-v99m-4gvg when
      # its range widened to <1.1.17. Failing the build instead would mean a
      # freshly-published advisory with no patch available blocks every PR — in
      # a template repo other people clone, that is someone else's broken CI.
      #
      # The previous `|| true` was the actual bug: it reported nothing at all,
      # so findings scrolled past in a log nobody opens and this check stayed
      # green through a live high-severity advisory. Writing to the step summary
      # keeps it non-blocking while putting findings on the run page.
      - name: pnpm audit (advisory)
        run: |
          if pnpm audit --audit-level=high > audit.txt 2>&1; then
            echo '### ✅ `pnpm audit`: no high-severity advisories' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### ⚠️ `pnpm audit` found high-severity advisories'
              echo
              echo 'Advisory only — this step never fails the build. Transitive fixes'
              echo 'go in `overrides` (pnpm-workspace.yaml), a surface Dependabot alerts'
              echo 'on but cannot auto-update. See AGENTS.md > Dependencies.'
              echo
              echo '```text'
              cat audit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat audit.txt

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read # init reads workflow-run metadata; required on private repos
      contents: read
      security-events: write # analyze uploads the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # CodeQL code scanning requires GitHub Advanced Security ("Code Security")
      # to be enabled, which is a paid add-on on private repos and is disabled
      # by default. When disabled, only the upload in `analyze` fails with "Code
      # Security must be enabled", so `continue-on-error` lives on `analyze`
      # alone to keep this job green without blocking PRs. `init` fails normally
      # so genuine setup regressions (action resolution, language misconfig,
      # bad checkout) are still caught. Once Code Security is enabled the steps
      # pass and alerts upload normally (findings are reported via SARIF, not
      # via step failure).
      - uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        continue-on-error: true
        with:
          category: '/language:javascript-typescript'

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # BLOCKING, unlike the advisory scans above. secretlint already runs on
    # staged files via lefthook, but that only sees the diff a developer is
    # about to commit — it cannot catch a secret introduced in an earlier commit
    # on the branch, or one added by a tool. gitleaks scans the whole history.
    # It also covers what secretlint's preset misses, notably AWS keys.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gitleaks git` walks commits, not just the worktree — a shallow
          # clone would silently scan almost nothing and always pass.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        # Pinned by digest, not tag: a tag is mutable, and this is the job whose
        # whole purpose is trusting what it runs. Digest resolved for v8.30.1
        # (2026-03-21). Bump the tag and the digest together.
        # --redact keeps any finding's secret value out of the run log, which is
        # readable by anyone with repo access (and world-readable if public).
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact
