name: Devcontainer image

# Ported from the reference GitLab `build-devcontainer-image` job.
#
# Two modes, one job:
#   - pull request → BUILD ONLY. Catches a broken Dockerfile (a superseded apt
#     pin, a rotated release asset, a stale SHA256) before it merges and breaks
#     every contributor's rebuild.
#   - push to main touching the devcontainer → build AND push to GHCR, tagged
#     with the commit SHA and `latest`.
#
# GHCR needs no secrets: GITHUB_TOKEN + `packages: write` is enough, and the
# package is created on first push. Once it has published once, devcontainer.json
# can swap `build` for `image: ghcr.io/<owner>/<repo>/devcontainer:latest`.
#
# WHY THE pull_request TRIGGER HAS NO `paths:` FILTER
# ---------------------------------------------------
# This job is a REQUIRED status check on main. Branch protection waits for a
# check of a given NAME to report; a workflow filtered by `paths:` simply does
# not run on unrelated PRs, so the required check never reports and the PR is
# blocked forever — every check green, nothing to point at. (That exact failure
# already cost this repo one debugging session, via a renamed job.)
#
# So the job always runs and always reports. The expensive part — a ~2.8 GB
# image build — is gated on an explicit diff against the PR base instead, so an
# unrelated PR pays a few seconds rather than ~10 minutes. The `push` trigger
# keeps its `paths:` filter, since publishing genuinely only matters when the
# devcontainer changed and nothing requires that check.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # STABLE, literal name. It was previously interpolated
    # ("Build${{ ... }} devcontainer image"), which renders differently per
    # event — fine for display, but a required check is matched by name, so an
    # event-dependent name is a latent version of the same trap described above.
    name: Build devcontainer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base commit present to diff against it.
          fetch-depth: 0

      - name: Does this change affect the devcontainer?
        id: scope
        # Mirrors the `paths:` list the pull_request trigger used to carry.
        # BASE/HEAD go through env rather than direct interpolation: they are
        # SHAs here, but interpolating event data into a shell body is the
        # pattern that turns into script injection the moment the source
        # changes. On non-PR events there is nothing to diff, so build.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — building."
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD" -- \
            '.devcontainer/**' 'mise.toml' 'mise.lock' \
            '.github/workflows/devcontainer.yml')"
          if [ -n "$changed" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "Devcontainer inputs changed:"; echo "$changed"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "No devcontainer inputs changed — skipping the image build."
          fi

      - name: Free up runner disk space
        # The image is large (Gortex alone unpacks to ~285 MB of embedded
        # tree-sitter grammars, plus the AWS CLI and opencode). A stock
        # ubuntu-latest runner has ~14 GB free, which this can exhaust mid-build
        # with a confusing "no space left on device". Dropping the preinstalled
        # Android SDK / .NET / GHC trees buys ~20 GB and costs ~30 s.
        if: steps.scope.outputs.affected == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v4
        if: steps.scope.outputs.affected == 'true'

      - name: Log in to GHCR
        # Only when we intend to push — a PR from a fork has a read-only token.
        if: steps.scope.outputs.affected == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        if: steps.scope.outputs.affected == 'true'
        # Package names must be lowercase; ${{ github.repository }} preserves
        # the owner's casing, so normalize it.
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/devcontainer"
          {
            echo "tags=${IMAGE}:${{ github.sha }},${IMAGE}:latest"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      # The Dockerfile takes every version as a build ARG and refuses to build
      # without them. Locally that wiring is Docker Compose auto-loading
      # `.devcontainer/.env`; build-push-action runs a plain `docker build`,
      # which does not, so the manifest is passed explicitly here.
      #
      # Piping the whole file through rather than listing keys is deliberate:
      # an explicit list is a second copy of the manifest that silently rots
      # the moment a pin is added, and the failure mode is a build arg that is
      # empty rather than absent. Comments and blank lines are stripped;
      # everything else is already `KEY=VALUE`, which is exactly the format
      # build-args wants.
      #
      # This does pass the ~10 mise tool versions too, which the Dockerfile
      # does not declare as ARGs (mise reads them from the copied .env at
      # `mise install` time instead). BuildKit logs "one or more build-args
      # were not consumed" for those — expected and harmless. Do NOT "fix" it
      # by hand-listing the consumed keys; that reintroduces the rot this
      # avoids.
      - name: Load pins from the manifest
        id: pins
        if: steps.scope.outputs.affected == 'true'
        run: |
          set -euo pipefail
          {
            echo 'args<<PINS_EOF'
            grep -vE '^[[:space:]]*(#|$)' .devcontainer/.env
            echo 'PINS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.scope.outputs.affected == 'true'
        uses: docker/build-push-action@v7
        with:
          # Repo root, matching docker-compose.yml's `context: ..` — the
          # Dockerfile COPYs mise.toml, mise.lock and .devcontainer/.env from
          # the root.
          context: .
          file: .devcontainer/Dockerfile
          build-args: ${{ steps.pins.outputs.args }}
          # linux/amd64 only: that is what GitHub runners and Codespaces use.
          # Adding linux/arm64 here means QEMU-emulating a ~2.8 GB image build
          # and pushes the job past 30 min. Apple-silicon developers build
          # natively from devcontainer.json instead of pulling.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "## Devcontainer image"
            echo ""
            if [ "${{ steps.scope.outputs.affected }}" != "true" ]; then
              echo "- No devcontainer inputs changed — image build skipped."
              echo "- The check still reports so it can gate merges to \`main\`."
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- Build-only (pull request) — image not pushed."
            else
              echo "- Pushed \`${{ steps.meta.outputs.image }}:${{ github.sha }}\`"
              echo "- Pushed \`${{ steps.meta.outputs.image }}:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
