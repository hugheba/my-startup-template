name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job here only reads the repo — checkout, install, build, boot. Stated
# explicitly rather than inherited: the repository default is a settings toggle,
# so a workflow with no block silently gains write access the moment someone
# flips it. A job that needs more grants itself more, next to the step that
# needs it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NOTE: this job's `name` is a REQUIRED status check in main's branch
  # protection, which matches on the check-run name. Renaming it (or folding it
  # into another job) makes the required check never report, and every PR is
  # blocked forever with no visible failure. Keep the name as-is unless you
  # update branch protection in the same change.
  verify-vscode:
    name: VS Code extension lockstep
    runs-on: ubuntu-latest
    # Dependency-free by design: plain node, no pnpm install, so it fails fast
    # and cheaply before the heavier job below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: node scripts/verify-vscode-extensions.mjs

  # NOTE: this job's `name` is also a REQUIRED status check — same warning as
  # above applies.
  verify-deps:
    name: Dependencies pinned to exact versions
    runs-on: ubuntu-latest
    # Its own job rather than a step on the one above so it reports a distinct
    # status check — that job's name is load-bearing for branch protection and
    # should not accumulate unrelated responsibilities.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: node scripts/verify-exact-deps.mjs

      # Toolchain pins live in .devcontainer/.env and are templated into
      # mise.toml; mise.lock holds the per-platform checksums they are verified
      # against. Those two can silently desync: bumping a version in .env DOES
      # take effect (the request wins over a stale lock), but the old lock entry
      # orphans and that tool's next install has no reviewed hash to check
      # against — mise records whatever it downloads. That is a fail-OPEN
      # supply-chain gap, so it is gated here rather than left to discipline.
      #
      # This deliberately does NOT run `mise lock` and diff the result. That was
      # the first implementation and it failed on a lockfile that was correct:
      # `mise lock` verifies SLSA provenance only for the platform it runs on
      # and writes `provenance_verified = true` onto that platform's entry
      # alone, so a lock generated on macos-arm64 differs from CI's linux-x64 by
      # exactly that one line — and would have failed forever for every
      # contributor not on the runner's platform. A gate that fails on correct
      # input is worse than no gate.
      #
      # The script checks the invariant instead — every declared tool has a lock
      # entry at exactly the version the manifest pins, on all four platforms —
      # which is platform-independent, needs no network, and keeps this job
      # dependency-free.
      - run: node scripts/verify-mise-lock.mjs

  lint-typecheck-build-test:
    name: Lint + Typecheck + Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 }

      - name: Enable Corepack (reads packageManager from package.json)
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', '**/package.json', 'turbo.json', 'tsconfig*.json', '.env.example') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Format check
        run: pnpm format:check

      # Runs as a step rather than its own job: the deps it needs are already
      # installed here, so a separate job would pay another ~40 s of pnpm
      # install for a lint that takes ~2 s. Scope and rule set live in
      # .markdownlint-cli2.jsonc.
      - name: Markdown lint
        run: pnpm lint:md

      - name: Lint + Typecheck + Build + Test
        run: pnpm turbo run lint typecheck build test

      # A green `next build` does not mean the app runs. A server component
      # that reads a missing env var, a runtime-only import that resolved at
      # build time, a broken standalone output — all compile clean and die on
      # the first request. The only job that actually booted the app was the
      # ZAP scan, which is NOT a required check, so a PR that builds and
      # cannot start was mergeable.
      #
      # This lives here rather than in its own job for two reasons: the build
      # it needs is already on disk, and a new job would need its `name`
      # registered in branch protection to block anything (see the NOTE above
      # verify-vscode). A step in an already-required job blocks on day one.
      #
      # The job name is deliberately NOT updated to mention boot — it is a
      # required status check and renaming it silently un-gates the branch.
      - name: Boot check
        run: |
          pnpm -F web start > /tmp/boot.log 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            curl -fsS http://localhost:3000 >/dev/null && exit 0
            # A process that died is the failure this check exists to catch, so
            # report it the moment it happens. Polling a dead server for the
            # full timeout turns a one-second answer into a one-minute wait and
            # then blames it on a timeout.
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::app exited during startup"
              cat /tmp/boot.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::app built successfully but never answered on :3000 within 60s"
          cat /tmp/boot.log
          exit 1
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
