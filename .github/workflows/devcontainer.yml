name: Devcontainer image

# Ported from the reference GitLab `build-devcontainer-image` job.
#
# Two modes, one job:
#   - pull_request touching the devcontainer → BUILD ONLY. Catches a broken
#     Dockerfile (a superseded apt pin, a rotated release asset, a stale
#     SHA256) before it merges and breaks every contributor's rebuild.
#   - push to main touching the devcontainer → build AND push to GHCR, tagged
#     with the commit SHA and `latest`.
#
# GHCR needs no secrets: GITHUB_TOKEN + `packages: write` is enough, and the
# package is created on first push. Once it has published once, devcontainer.json
# can swap `build` for `image: ghcr.io/<owner>/<repo>/devcontainer:latest`.

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/devcontainer.yml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build${{ github.event_name == 'push' && ' + publish' || '' }} devcontainer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Free up runner disk space
        # The image is large (Gortex alone unpacks to ~285 MB of embedded
        # tree-sitter grammars, plus the AWS CLI and opencode). A stock
        # ubuntu-latest runner has ~14 GB free, which this can exhaust mid-build
        # with a confusing "no space left on device". Dropping the preinstalled
        # Android SDK / .NET / GHC trees buys ~20 GB and costs ~30 s.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only when we intend to push — a PR from a fork has a read-only token.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        # Package names must be lowercase; ${{ github.repository }} preserves
        # the owner's casing, so normalize it.
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/devcontainer"
          {
            echo "tags=${IMAGE}:${{ github.sha }},${IMAGE}:latest"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root, matching devcontainer.json's `"context": ".."` — the
          # Dockerfile COPYs mise.toml from the root.
          context: .
          file: .devcontainer/Dockerfile
          # linux/amd64 only: that is what GitHub runners and Codespaces use.
          # Adding linux/arm64 here means QEMU-emulating a ~1 GB image build and
          # pushes the job past 30 min. Apple-silicon developers build natively
          # from devcontainer.json instead of pulling.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "## Devcontainer image"
            echo ""
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- Build-only (pull request) — image not pushed."
            else
              echo "- Pushed \`${{ steps.meta.outputs.image }}:${{ github.sha }}\`"
              echo "- Pushed \`${{ steps.meta.outputs.image }}:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
