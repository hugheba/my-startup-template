# Toolchain declaration. VERSIONS LIVE IN .devcontainer/.env, not here.
#
# mise owns every language and CLI it can resolve, so the dev container's
# Dockerfile stays thin and a host developer gets the identical toolchain with
# one `mise install`. There are deliberately no hand-rolled curl/tar/sha256sum
# blocks anywhere — hand-maintained per-arch hashes are exactly what drifts.
#
# WHY THE VERSIONS ARE ELSEWHERE
# ------------------------------
# `[env] _.file` below loads .devcontainer/.env, and every version is templated
# from it. That one file is also auto-loaded by Docker Compose (it sits beside
# docker-compose.yml and is literally named `.env`), which is what feeds the
# Dockerfile's build ARGs for the base image digest, apt pins and npm globals —
# things mise cannot express. One manifest, two consumers, no second place for
# a version to drift to. See AGENTS.md, "Toolchain (mise)".
#
# Verified behaviour (mise 2026.7.18): `_.file` is loaded BEFORE tool-version
# resolution, so the templates below resolve; the path is relative to this file
# rather than the shell's cwd, so it works from any subdirectory; and a missing
# file or missing key makes mise exit 1 with the offending field named, so an
# incomplete manifest fails the build loudly instead of yielding a toolless
# image.
#
# INTEGRITY: mise.lock (committed next to this file) pins every tool to an exact
# release asset URL + SHA256 for every platform, and records SLSA provenance
# where the publisher signs it. Templating costs nothing here — the lock is
# generated against the RESOLVED versions. mise only maintains a lockfile that
# already EXISTS, so never delete mise.lock.
#
# TO BUMP: edit .devcontainer/.env, then
#   mise lock -p linux-x64,linux-arm64,macos-arm64,macos-x64
# and commit both files together. CI fails the PR if mise.lock is out of sync —
# a bumped version against a stale lock has no reviewed checksum to verify.

[env]
_.file = ".devcontainer/.env"

[tools]
# ---- languages -----------------------------------------------------------
# Stay inside major 24 to match .nvmrc, package.json `engines.node`, and
# `node-version` in .github/workflows/*.yml.
# pnpm is deliberately absent: it is pinned by package.json `packageManager`
# and materialized by Corepack, so a second pin here could drift.
node = "{{ env.NODE_VERSION }}"

# Kept in lockstep with scripts/.python-version. uv creates scripts/.venv from it.
python = "{{ env.PYTHON_VERSION }}"

# GraalVM CE 21 with native-image. See .devcontainer/.env for why community
# rather than Oracle, and for the zlib1g-dev link-time dependency. Also the JVM
# that kotlin and gradle below run on, and that JAVA_HOME points at.
java = "{{ env.JAVA_VERSION }}"

# Kotlin compiler. Declared AFTER java deliberately — it needs a JVM to run on
# and mise installs in declaration order.
kotlin = "{{ env.KOTLIN_VERSION }}"

# Gradle, the build tool for both. A committed wrapper still takes precedence
# (see .devcontainer/.env); this is the fallback and what `gradle init` runs
# from. Maven is deliberately absent — adding it would mean a second build tool
# nothing in this template uses.
gradle = "{{ env.GRADLE_VERSION }}"

# Rust: rustc, cargo and the components below. Cargo needs a linker, which
# build-essential (pinned in .devcontainer/.env) already provides.
#
# `components` is NOT decoration. rustup's default profile omits rust-src, and
# without it rust-analyzer cannot resolve the standard library: hovering `Vec`
# or jumping into `Option` fails, and the extension reports it as a sysroot
# error rather than a missing component. clippy and rustfmt are in the default
# profile today and are named anyway, so a future profile change cannot remove
# them silently.
#
# The one tool here whose lock entry carries no checksums — mise's backend
# delegates to rustup. .devcontainer/.env explains why, and
# scripts/verify-mise-lock.mjs names the exemption instead of hiding it.
rust = { version = "{{ env.RUST_VERSION }}", components = "rust-src,clippy,rustfmt" }

# ---- utilities -----------------------------------------------------------
uv = "{{ env.UV_VERSION }}"         # python package/venv manager for scripts/
gh = "{{ env.GH_VERSION }}"         # GitHub CLI (was a devcontainer feature)
awscli = "{{ env.AWSCLI_VERSION }}" # apps/web deploys via AWS Amplify

# Secret scanner, run by the pre-commit hook AND by CI. It is pinned here so the
# two are the same binary reading the same rules — the previous split (secretlint
# locally, gitleaks in CI) meant the innermost gate was the weakest one, and
# nothing in either config said so. A static Go binary is also why this is
# viable in a hook at all: it scans staged files in milliseconds, where the
# Node-based scanner it replaced paid interpreter startup on every commit.
gitleaks = "{{ env.GITLEAKS_VERSION }}"

# ---- agent tooling -------------------------------------------------------
opencode = "{{ env.OPENCODE_VERSION }}" # terminal AI agent, for delegated review passes
rtk = "{{ env.RTK_VERSION }}"           # LLM token-reduction CLI proxy

# Gortex — code-intelligence graph served to agents over MCP. Not in mise's
# registry, so it comes straight from its GitHub releases; the `github:` backend
# verifies the SLSA provenance the project publishes. (`ubi:` also works but is
# deprecated and removed in mise 2027.1.0.)
"github:zzet/gortex" = "{{ env.GORTEX_VERSION }}"

# NOT HERE: the Claude Code CLI. mise's npm backend installs with
# --ignore-scripts / --omit=optional, so the package's postinstall never runs
# and its platform-native binary is never downloaded — `claude` then fails at
# runtime with "claude native binary not installed". Verified by building this
# image with it declared here. It is installed with `npm install -g` in the
# Dockerfile instead, pinned by CLAUDE_CODE_VERSION in .devcontainer/.env.
