packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/config/*'

# ---------------------------------------------------------------------------
# pnpm settings
#
# As of pnpm 11 this file is the ONLY place pnpm reads settings from. `.npmrc`
# is restricted to auth/registry credentials, and the `pnpm` field in
# package.json is no longer read at all. A leftover `pnpm` field at least warns;
# a setting left in `.npmrc` is dropped in COMPLETE SILENCE and simply stops
# applying. Keep settings here.
# ---------------------------------------------------------------------------

# Refuse to install a package that declares incompatibility with our Node.
engineStrict: true

# `pmOnFail` is deliberately NOT set. Its default, `download`, is what makes
# `packageManager` a pin rather than an assertion: a contributor whose shell
# pnpm differs gets the pinned version fetched and run for them. `error` looks
# stricter but enforces nothing extra — the pinned version runs either way —
# and it breaks anything invoking pnpm outside an activated shell, git hooks
# first among them. The old `.npmrc` carried `package-manager-strict=true`,
# which only restated pnpm 9's default; pnpm 10 changed that default on purpose.

autoInstallPeers: true
strictPeerDependencies: false

# AWS Amplify WEB_COMPUTE (Next.js SSR) can't resolve `next` through pnpm's
# default symlinked store at deploy time. A hoisted (flat) node_modules lets
# Amplify and Next's standalone tracer find runtime deps. See FAQ:
# https://github.com/aws-amplify/amplify-hosting/blob/main/FAQ.md#using-a-monorepo-framework
nodeLinker: hoisted

# Transitive advisory remediation. These are a snapshot, not a subscription: an
# advisory range widens over time until a pinned version sits back inside it,
# which is how four of these five came to be vulnerable while still looking
# pinned. Dependabot alerts caught three; the fourth surfaced only from running
# `pnpm audit` by hand, because in CI that step is advisory-only and cannot fail
# a build. Neither signal is one you get without going to look.
#
# When you bump one, MOVE THE SELECTOR TOO. The key is a range, and a stale one
# matches nothing: `postcss@<8.5.18` had stopped matching 8.5.18-8.5.22, so
# raising only the value on the right would have left an override that reads as
# enforcement and applies to nothing. Drop an entry once the real dependency has
# moved past it on its own.
overrides:
  'postcss@<8.5.25': '8.5.25'
  'sharp@<0.35.0': '0.35.0'
  'fast-uri@<3.1.5': '3.1.5'
  'brace-expansion@<1.1.18': '1.1.18'
  'brace-expansion@>=2.0.0 <5.0.9': '5.0.9'

# Dependency lifecycle scripts are blocked by default and `strictDepBuilds`
# defaults to true, so an unreviewed one FAILS the install rather than warning.
# Every entry here is a deliberate decision; adding one grants that package
# arbitrary code execution at install time. `pnpm approve-builds` appends
# placeholders here when a new dependency asks.
allowBuilds:
  # Its postinstall only runs `lefthook install -f`, which our own root
  # `prepare` script already does. The binary comes from a per-platform
  # optionalDependency, not from this script — nothing is lost by denying it.
  lefthook: false
